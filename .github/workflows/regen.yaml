name: Regen source files and crowdin.yml

on:
  push:
    branches:
      - seventeen
    paths:
      - repos.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen-crowdin-config:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - env:
          X_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run main.py

      - name: Install Gerrit commit-msg hook
        run: |
          curl -fsSLo .git/hooks/commit-msg https://review.pixelos.net/tools/hooks/commit-msg
          chmod +x .git/hooks/commit-msg

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Sync resources with upstream sources
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
